<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 4 | Bank Account Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        color: #172b4d;
        background: #f3f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 20px;
      }

      main {
        width: min(940px, 100%);
        margin: 0 auto;
      }

      header {
        margin-bottom: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #5167d5;
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 5vw, 2.8rem);
        letter-spacing: -0.04em;
      }

      header p:last-child {
        margin-bottom: 0;
        color: #64748b;
      }

      .accounts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }

      .account-card,
      .panel {
        border: 1px solid #e1e8f2;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 26px rgb(23 43 77 / 5%);
      }

      .account-card {
        padding: 20px;
      }

      .account-card h2 {
        margin-bottom: 4px;
        font-size: 1.05rem;
      }

      .account-card p {
        margin-bottom: 16px;
        color: #64748b;
        font-size: 0.9rem;
      }

      .balance {
        margin: 0;
        color: #233c78;
        font-size: 1.75rem;
        font-weight: 750;
        letter-spacing: -0.04em;
      }

      .panel {
        padding: clamp(20px, 4vw, 28px);
      }

      .panel h2 {
        margin-bottom: 20px;
        font-size: 1.2rem;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #344563;
        font-size: 0.9rem;
        font-weight: 650;
      }

      input,
      select,
      button {
        min-height: 44px;
        border-radius: 9px;
        font: inherit;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #ced8e6;
        padding: 0 12px;
        color: #172b4d;
        background: #fff;
      }

      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid rgb(81 103 213 / 25%);
        outline-offset: 2px;
      }

      button {
        border: 0;
        padding: 0 16px;
        color: #fff;
        background: #4559c7;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: #3548b0;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .submit-row {
        display: flex;
        align-items: center;
        gap: 14px;
        grid-column: 1 / -1;
      }

      #feedback {
        margin: 0;
        color: #24744a;
        font-size: 0.9rem;
      }

      #feedback.error {
        color: #b42318;
      }

      .history {
        margin-top: 22px;
      }

      .history h2 {
        margin-bottom: 12px;
      }

      #transactions {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .transaction {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #edf1f7;
        padding: 12px 0;
        color: #475569;
        font-size: 0.9rem;
      }

      .transaction strong {
        color: #172b4d;
      }

      .empty {
        margin: 0;
        color: #64748b;
        font-size: 0.9rem;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 580px) {
        body {
          padding: 30px 16px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .submit-row {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">OOP revision · Level 4</p>
        <h1>Bank account demo</h1>
        <p>Try a deposit, withdrawal, or transfer between the sample accounts.</p>
      </header>

      <section id="accounts" class="accounts" aria-label="Account balances"></section>

      <section class="panel" aria-labelledby="transaction-heading">
        <h2 id="transaction-heading">Make a transaction</h2>
        <form id="transaction-form">
          <label>
            Action
            <select id="type" name="type">
              <option value="deposit">Deposit</option>
              <option value="withdrawal">Withdraw</option>
              <option value="transfer">Transfer</option>
            </select>
          </label>
          <label>
            Account
            <select id="account" name="email"></select>
          </label>
          <label id="recipient-field" hidden>
            Send to
            <select id="recipient" name="toEmail"></select>
          </label>
          <label>
            Amount ($)
            <input
              id="amount"
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="25.00"
              required
            />
          </label>
          <div class="submit-row">
            <button id="submit" type="submit">Complete transaction</button>
            <p id="feedback" role="status" aria-live="polite"></p>
          </div>
        </form>

        <section class="history" aria-labelledby="history-heading">
          <h2 id="history-heading">Recent activity</h2>
          <ul id="transactions"></ul>
        </section>
      </section>
    </main>

    <script>
      const accountsElement = document.querySelector("#accounts");
      const accountSelect = document.querySelector("#account");
      const recipientSelect = document.querySelector("#recipient");
      const recipientField = document.querySelector("#recipient-field");
      const typeSelect = document.querySelector("#type");
      const transactionList = document.querySelector("#transactions");
      const feedback = document.querySelector("#feedback");
      const form = document.querySelector("#transaction-form");

      const formatMoney = (amount) =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
        }).format(amount);

      const addOption = (select, account) => {
        const option = document.createElement("option");
        option.value = account.email;
        option.textContent = `${account.name} (${account.email})`;
        select.append(option);
      };

      const showAccounts = (accounts, selectedEmail = accountSelect.value) => {
        accountsElement.replaceChildren();
        accountSelect.replaceChildren();
        recipientSelect.replaceChildren();

        for (const account of accounts) {
          const card = document.createElement("article");
          card.className = "account-card";
          const name = document.createElement("h2");
          name.textContent = account.name;
          const email = document.createElement("p");
          email.textContent = account.email;
          const balance = document.createElement("p");
          balance.className = "balance";
          balance.textContent = formatMoney(account.balance);
          card.append(name, email, balance);
          accountsElement.append(card);
          addOption(accountSelect, account);
          addOption(recipientSelect, account);
        }

        if (accounts.some((account) => account.email === selectedEmail)) {
          accountSelect.value = selectedEmail;
        }
        updateRecipients();
      };

      const updateRecipients = () => {
        const senderEmail = accountSelect.value;
        for (const option of recipientSelect.options) {
          option.hidden = option.value === senderEmail;
        }
        if (recipientSelect.value === senderEmail) {
          const otherOption = [...recipientSelect.options].find(
            (option) => option.value !== senderEmail,
          );
          if (otherOption) recipientSelect.value = otherOption.value;
        }
      };

      const showTransactions = (transactions) => {
        transactionList.replaceChildren();
        if (transactions.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No transactions yet.";
          transactionList.append(empty);
          return;
        }

        for (const transaction of [...transactions].reverse()) {
          const item = document.createElement("li");
          item.className = "transaction";
          const description = document.createElement("span");
          description.textContent = transaction.relatedAccount
            ? `${transaction.type} · ${transaction.relatedAccount}`
            : transaction.type;
          const amount = document.createElement("strong");
          amount.textContent = formatMoney(transaction.amount);
          item.append(description, amount);
          transactionList.append(item);
        }
      };

      const loadTransactions = async (email) => {
        const response = await fetch(
          `/api/accounts/${encodeURIComponent(email)}/transactions`,
        );
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        showTransactions(result);
      };

      const loadAccounts = async (selectedEmail) => {
        const response = await fetch("/api/accounts");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        showAccounts(result, selectedEmail);
        await loadTransactions(accountSelect.value);
      };

      typeSelect.addEventListener("change", () => {
        recipientField.hidden = typeSelect.value !== "transfer";
      });

      accountSelect.addEventListener("change", () => {
        updateRecipients();
        loadTransactions(accountSelect.value).catch((error) => {
          feedback.className = "error";
          feedback.textContent = error.message;
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        feedback.className = "";
        feedback.textContent = "";
        const submit = document.querySelector("#submit");
        submit.disabled = true;

        try {
          const payload = {
            type: typeSelect.value,
            email: accountSelect.value,
            amount: Number(document.querySelector("#amount").value),
            toEmail: recipientSelect.value,
          };
          const response = await fetch("/api/transactions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);

          showAccounts(result.accounts, payload.email);
          showTransactions(result.transactions);
          feedback.textContent = "Transaction completed.";
          document.querySelector("#amount").value = "";
        } catch (error) {
          feedback.className = "error";
          feedback.textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      });

      loadAccounts().catch((error) => {
        feedback.className = "error";
        feedback.textContent = error.message;
      });
    </script>
  </body>
</html>
